name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -e .[dev]

      # New and maintained code must be lint-clean (blocking).
      - name: Lint maintained code (blocking)
        run: ruff check src/finai/assistant apps/ask_finai tests/unit/test_ask_finai.py

      # Older code has ~650 pre-existing findings. Report them without failing the run,
      # so tests still execute. Clean up gradually and add folders to the step above.
      - name: Lint full repository (report only)
        run: ruff check . --exit-zero --statistics

      - run: pytest
