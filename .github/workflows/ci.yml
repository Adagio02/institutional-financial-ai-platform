name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Integration tests expect Postgres on localhost:5433
      # (see src/finai/core/config.py and docker-compose.yml).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finai
          POSTGRES_PASSWORD: finai
          POSTGRES_DB: finai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finai -d finai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finai:finai@localhost:5433/finai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -e .[dev]

      # New and maintained code must be lint-clean (blocking).
      - name: Lint maintained code (blocking)
        run: ruff check src/finai/assistant apps/ask_finai tests/unit/test_ask_finai.py

      # Older code has ~650 pre-existing findings. Report them without failing the run,
      # so tests still execute. Clean up gradually and add folders to the step above.
      - name: Lint full repository (report only)
        run: ruff check . --exit-zero --statistics

      - name: Run database migrations
        run: alembic upgrade head

      - run: pytest
