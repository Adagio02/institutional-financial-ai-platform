[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-financial-ai-platform"
version = "0.1.0"
description = "Research-grade institutional financial AI platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pandas>=2.2",
  "polars>=1.5",
  "pyarrow>=17",
  "duckdb>=1.1",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "cvxpy>=1.5",
  "mlflow>=2.16",
  "optuna>=4.0",
  "shap>=0.46",
  "sentence-transformers>=3.1",
  "qdrant-client>=1.12",
  "openai>=1.50",
  "prefect>=3.0",
  "streamlit>=1.39",
  "plotly>=5.24",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.12",
  "tenacity>=9.0",
  "numpy",
  "pandas",
  "pyarrow",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-requests>=2.32"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
