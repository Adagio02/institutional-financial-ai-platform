services:
  finai-dashboard:
    build:
      context: ./ui/r
      dockerfile: Dockerfile

    container_name: finai-v42-dashboard

    restart: unless-stopped

    ports:
      - "3838:3838"

    environment:
      FINAI_ARTIFACT_ROOT: /app/artifacts
      FINAI_RESEARCH_ROOT: /app/research
      FINAI_ASK_URL: http://127.0.0.1:8502

    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./research:/app/research:ro

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3838"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s